[package]
name = "infiniterm-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The editor without a toolkit: a rope buffer with undo, tree-sitter
# highlighting, search. `infiniterm-ui` draws it. No gpui here so the
# logic tests run headless, the way `infiniterm-term` does for the grid.
[dependencies]
ropey = "1.6"
similar = "2"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-md = "0.5"
tree-sitter-svelte-ng = "1.0"
