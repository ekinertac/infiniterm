# Linux builds of the three binaries a server needs (#118): `iftd` (the
# session daemon), `ift` (the CLI) and `infiniterm-hook`. This proves the rest
# still compiles and runs on Linux, and packages static musl binaries for the
# remote-instance work. The `app` job checks that the desktop app compiles
# on Linux too (#464); there is no Linux app package yet.
#
# When a release is published (`make publish`, from the Mac) the same build
# runs on the release's tag and attaches `infiniterm-server-<tag>-linux-
# <arch>.tar.gz` and its `.sha256` to that release, so `ift connect` can fetch
# what matches the app. Nothing in tools/publish.sh changes: the release event
# starts it. The upload step only runs for that event, so it is first proven
# by the first release after this lands.
#
# Static musl so no glibc version on the server matters. x86_64 on a normal
# runner, aarch64 on GitHub's arm runner: each builds natively, no cross
# toolchain. Related: infiniterm-session/Cargo.toml, tools/publish.sh.
name: linux

on:
  pull_request:
    paths:
      - "infiniterm-core/**"
      - "infiniterm-term/**"
      - "infiniterm-session/**"
      - "infiniterm-cli/**"
      - "infiniterm-hook/**"
      - "infiniterm-ui/**"
      - "infiniterm-editor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/linux.yml"
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p infiniterm-session -p infiniterm-cli -p infiniterm-hook
      - name: what came out
        run: |
          cd target/${{ matrix.target }}/release
          ls -la iftd ift infiniterm-hook
          file iftd ift infiniterm-hook
      - name: package
        id: pkg
        run: |
          arch=${{ matrix.target }}
          arch=${arch%%-*}
          tag=${{ github.event.release.tag_name || 'dev' }}
          name=infiniterm-server-$tag-linux-$arch.tar.gz
          mkdir -p dist
          tar -czf dist/$name -C target/${{ matrix.target }}/release iftd ift infiniterm-hook
          (cd dist && sha256sum $name > $name.sha256)
          ls -la dist
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*

  # Only for a published release: put the packages on it.
  # The Linux desktop app's tarball (#464): built for a published release
  # and by hand (`workflow_dispatch`, to try it on a branch), not for every
  # PR (a release build is many minutes; the `app` job below checks that it
  # compiles). glibc, not musl: the app links the system's X11, Wayland and
  # Vulkan. Ubuntu 22.04 so the binaries run on glibc 2.35 and newer.
  # tools/linux-dist.sh lays it out; site/public/install.sh installs it.
  desktop:
    name: desktop ${{ matrix.arch }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev clang
      - name: build
        run: >
          cargo build --release --locked
          -p infiniterm-ui --no-default-features
          -p infiniterm-cli -p infiniterm-session -p infiniterm-hook
      - name: package
        run: tools/linux-dist.sh target/release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: dist/*

  release-assets:
    name: attach to the release
    if: github.event_name == 'release'
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: linux-*
          merge-multiple: true
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release upload "${{ github.event.release.tag_name }}" assets/* \
            --repo "${{ github.repository }}" --clobber

  # The desktop app compiles on Linux (#464), without browser cards: a Mac-only
  # call added without a gate would otherwise break it silently, since every
  # session builds on a Mac. glibc, not musl, because the app links the X11,
  # Wayland and Vulkan system libraries; the package list is the one in
  # docs/agent/linux-port.md. Clippy, not a build: it checks the same code in
  # a fraction of the time.
  app:
    name: app compiles on linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev clang
      - run: cargo clippy --locked -p infiniterm-ui --no-default-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked -p infiniterm-core -p infiniterm-term -p infiniterm-session
