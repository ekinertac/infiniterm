# Pure app logic and, in later phases, backend services for the native port.
# Used by the terminal and UI crates; src/lib.rs exposes the public modules.
# Keep graphical dependencies out of this crate. See ../HANDOVER.md.
[package]
name = "infiniterm-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The save file and config are JSON; the reference validates shapes by hand
# (parseUsage, parseLayout) and the port keeps that, so only Value is needed.
serde = { version = "1", features = ["derive"] }
# preserve_order: the defaults file and the save file are rendered from
# values and must keep the reference's key order, not alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }
