# Pure app logic and, in later phases, backend services for the native port.
# Used by the terminal and UI crates; src/lib.rs exposes the public modules.
# Keep graphical dependencies out of this crate. See ../HANDOVER.md.
[package]
name = "infiniterm-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The save file and config are JSON; the reference validates shapes by hand
# (parseUsage, parseLayout) and the port keeps that, so only Value is needed.
serde = { version = "1", features = ["derive"] }
# preserve_order: the defaults file and the save file are rendered from
# values and must keep the reference's key order, not alphabetical.
# float_roundtrip: without it serde_json parses -2308.9849719816602 one ULP
# off, and the save file would drift by a bit on every load/save cycle.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# links.rs ports three regexes from the reference; hand-rolling them would
# be the one place the port could silently diverge from what gets underlined.
regex = "1"
# transcript.rs turns a session timestamp into local hours and minutes.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The backend, moved from the Tauri app's src-tauri/src as it was.
portable-pty = "0.9"
anyhow = "1"

[dev-dependencies]
# The PTY tests are async because SessionBackend::spawn is (tmux assigns ids
# asynchronously, v2); the app itself runs them on gpui's executor.
tokio = { version = "1", features = ["rt", "macros"] }
