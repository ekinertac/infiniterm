# The terminal engine boundary: alacritty_terminal's Term and VT parser
# wrapped as "a grid of styled cells plus a byte sink", the output
# scheduler, key and mouse encoders, the palette. No gpui here: the ui
# crate paints the frames this crate hands out. See ../HANDOVER.md.
[package]
name = "infiniterm-term"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
infiniterm-core = { path = "../infiniterm-core" }
# Term + vte only; its event loop is not used (1 fps under flood, see
# spikes/term-zoom/NOTES.md). The PTY reader is core's local_pty.rs.
alacritty_terminal = "0.26"
