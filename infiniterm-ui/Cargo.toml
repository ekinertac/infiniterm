# The app: gpui window, canvas, card frames, palette, panels. Wiring over
# infiniterm-core's model; every rule with logic in it lives there, tested.
# gpui is confined to this crate on purpose (see ../HANDOVER.md): if it churns
# past tolerance this crate is rewritten and nothing else moves.
[package]
name = "infiniterm-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "infiniterm"
path = "src/main.rs"

# Browser cards are the system web view (WKWebView through wry, #761), so the
# feature means "the webview engine, macOS only" (#826): its optional
# dependencies are under the macOS target below, so on other systems naming
# them here changes nothing, and `main.rs` draws `browser_stub.rs` there.
# ON by default; `--no-default-features` draws the stub on the Mac too, which
# is also the shape of the Lite/Pro split in ekinertac/notes#50.
[features]
default = ["browser"]
browser = ["dep:wry", "dep:objc2", "dep:objc2-foundation", "dep:block2"]

[dependencies]
infiniterm-core = { path = "../infiniterm-core" }
infiniterm-term = { path = "../infiniterm-term" }
infiniterm-editor = { path = "../infiniterm-editor" }
image = "0.25"
smallvec = "1"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cocoa: the app menu, the reduced-motion switch, and the NSEvent monitor
# that gives `keycode.rs` the physical key. Nothing else links them, and on
# Windows they would only add an objc runtime the linker cannot find.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
# Registering the bundled icon font with CoreText (icon_font.rs); both are
# already in the tree as gpui's own dependencies.
core-graphics = "0.24"
core-text = "21"
foreign-types = "0.5"
# The webview engine (`webview.rs`): wry makes the WKWebView, objc2 and block2
# make the few AppKit calls wry does not wrap (snapshot, back, forward, wash).
wry = { version = "0.57", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

# `keycode.rs`: the thread-local keyboard hook that gives the chord its
# PHYSICAL key. gpui's Windows keystroke names the key through the current
# layout, which is the whole problem (see that file's header).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

# `keycode.rs` on Linux: the X11 `QueryKeymap` that gives the chord its
# PHYSICAL key, on a connection of our own. Already in the tree as gpui's
# own X11 dependency, so this adds no crate.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
