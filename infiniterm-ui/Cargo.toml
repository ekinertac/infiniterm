# The app: gpui window, canvas, card frames, palette, panels. Wiring over
# infiniterm-core's model; every rule with logic in it lives there, tested.
# gpui is confined to this crate on purpose (see ../HANDOVER.md): if it churns
# past tolerance this crate is rewritten and nothing else moves.
[package]
name = "infiniterm-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "infiniterm"
path = "src/main.rs"

[[bin]]
name = "infiniterm-helper"
path = "src/bin/helper.rs"

# For cef-rs's bundle-cef-app: the helper it lays out as the four
# `infiniterm Helper*.app` bundles beside the framework.
[package.metadata.cef.bundle]
helper_name = "infiniterm-helper"

[dependencies]
infiniterm-core = { path = "../infiniterm-core" }
infiniterm-term = { path = "../infiniterm-term" }
infiniterm-editor = { path = "../infiniterm-editor" }
infiniterm-browser = { path = "../infiniterm-browser" }
cef = "152.3.0"
image = "0.25"
smallvec = "1"
objc = "0.2"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
