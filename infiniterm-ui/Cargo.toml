# The app: gpui window, canvas, card frames, palette, panels. Wiring over
# infiniterm-core's model; every rule with logic in it lives there, tested.
# gpui is confined to this crate on purpose (see ../HANDOVER.md): if it churns
# past tolerance this crate is rewritten and nothing else moves.
[package]
name = "infiniterm-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "infiniterm"
path = "src/main.rs"

# CEF's helper process. Nothing to help without CEF, so it is not built
# when the browser feature is off.
[[bin]]
name = "infiniterm-helper"
path = "src/bin/helper.rs"
required-features = ["browser"]

# For cef-rs's bundle-cef-app: the helper it lays out as the four
# `infiniterm Helper*.app` bundles beside the framework.
[package.metadata.cef.bundle]
helper_name = "infiniterm-helper"

# Browser cards, and the whole of CEF with them, are a feature so there can
# be a build without them: Windows has no CEF build yet (phase 5 of
# docs/windows-handoff.md), and the Lite/Pro split in ekinertac/notes#50 is
# the same shape. ON by default, so macOS and every existing command are
# unchanged; `--no-default-features` draws `browser_stub.rs` instead.
[features]
default = ["browser"]
browser = ["dep:infiniterm-browser", "dep:cef"]

[dependencies]
infiniterm-core = { path = "../infiniterm-core" }
infiniterm-term = { path = "../infiniterm-term" }
infiniterm-editor = { path = "../infiniterm-editor" }
infiniterm-browser = { path = "../infiniterm-browser", optional = true }
cef = { version = "152.3.0", optional = true }
image = "0.25"
smallvec = "1"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cocoa: the app menu, the reduced-motion switch, and the NSEvent monitor
# that gives `keycode.rs` the physical key. Nothing else links them, and on
# Windows they would only add an objc runtime the linker cannot find.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
