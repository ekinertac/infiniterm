# Spike: can a separate process draw into a card well enough that typing,
# clicking and zooming feel native? Excluded from the workspace so
# `make check` never builds it. Its code goes when the question is
# answered; spikes/app-surface/NOTES.md keeps the numbers.
[package]
name = "app-surface"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
io-surface = "0.16"
core-foundation = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
