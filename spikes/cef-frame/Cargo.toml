[package]
name = "cef-frame"
version = "0.1.0"
edition = "2021"
publish = false

# Spike: CEF off-screen frames drawn as a texture inside a gpui window, zoomed,
# with the mouse forwarded back. Standalone package on purpose: the CEF
# build (libcef_dll_wrapper, cmake) is slow and must not be in the main
# workspace until the browser crate is real.
[workspace]

[[bin]]
name = "cef-frame"
path = "src/main.rs"

[[bin]]
name = "cef-frame-helper"
path = "src/bin/helper.rs"

[package.metadata.cef.bundle]
helper_name = "cef-frame-helper"

[dependencies]
cef = "152.3.0"
gpui = "0.2.2"
image = "0.25"
smallvec = "1"
# The objc crate gpui itself uses; for patching CefAppProtocol onto its NSApplication.
objc = "0.2"
