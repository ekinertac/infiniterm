# Native port workspace, used by root-level Cargo commands.
# Keep the crates separate so UI dependencies cannot leak into the core.
# The spikes' code is gone (their replacements are the crates); spikes/*/NOTES.md
# keep the measurements. See HANDOVER.md for the phase plan.
[workspace]
members = [
    "infiniterm-core",
    "infiniterm-term",
    "infiniterm-editor",
    "infiniterm-browser",
    "infiniterm-ui",
    "infiniterm-cli",
    "infiniterm-hook",
    "infiniterm-session",
]
resolver = "2"
# The spikes carry their own lockfiles; nothing in the app builds them.
exclude = ["spikes/card-texture"]

[workspace.package]
version = "0.5.9"
edition = "2021"
publish = false

# The debug build is what the driver measures, and the reference's numbers
# come from a Vite dev build whose JavaScript is JIT-compiled all the same.
# Optimising the dependencies (gpui's glyph paint, alacritty's parser) keeps
# the comparison honest while the port's own crates still build in seconds.
[profile.dev.package."*"]
opt-level = 3
